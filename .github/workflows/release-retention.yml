name: Release retention

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-retention-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Release events point at the tag; use the maintained cleanup script.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Keep three published releases
        run: python3 scripts/prune-releases.py --repo "$GITHUB_REPOSITORY" --apply
        env:
          GH_TOKEN: ${{ github.token }}
